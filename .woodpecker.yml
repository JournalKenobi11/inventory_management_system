steps:
  - name: install
    image: ghcr.io/cirruslabs/flutter:stable
    commands:
      - flutter pub get

  - name: analyze
    image: ghcr.io/cirruslabs/flutter:stable
    commands:
      - flutter analyze

  - name: architecture-check
    image: ghcr.io/cirruslabs/flutter:stable
    commands:
      - chmod +x scripts/check_architecture.sh
      - ./scripts/check_architecture.sh

  - name: test
    image: ghcr.io/cirruslabs/flutter:stable
    commands:
      - flutter test
